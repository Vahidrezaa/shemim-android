name: Diagnose Freeze (Emulator)

# اجرای اپ روی امولاتور واقعی اندروید و برداشت کامل شواهد فریز.
# نسخهٔ ۲ — دو سناریو در هر API:
#   S1: حالت روشن + اجرای مستقیم (am start) — خط پایه
#   S2: حالت تیره + زبان فارسی + اجرای «مثل تپ روی آیکون لانچر» (monkey)
# ماتریس API: 34 و 33 (اندروید ۱۳ = گوشی کاربر) و 29 (قبل از اسپلش سیستمی)
#
# این ورک‌فلو حتی وقتی اپ فریز باشد سبز می‌شود (مقصود، برداشت شواهد است؛
# تشخیص داخل artifact هاست).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-freeze.yml"

jobs:
  diagnose:
    name: Diagnose on emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 33, 29]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PversionCode=${{ github.run_number }}

      - name: Run app on emulator and collect diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # انیمیشن‌ها عمداً روشن می‌مانند: انیمیشن خروج اسپلش مظنون اصلی است
          disable-animations: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          emulator-boot-timeout: 900
          script: bash .github/emulator-diagnose.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-api${{ matrix.api-level }}
          path: |
            diag/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
